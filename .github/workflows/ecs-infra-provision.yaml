name: ECS Infrastructure Provisioning

on:
  workflow_dispatch: 

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Temporarily fallback to static keys to create the IAM infrastructure
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # 2. Deploy the OIDC Stack First
      - name: Deploy OIDC Identity Provider Stack
        run: |
          aws cloudformation deploy \
            --stack-name oidc-provider-infra \
            --template-file aws-infra/github-oidc-iam-role.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --region eu-north-1

      # 3. Deploy the Network & ECS Infrastructure Stack Second
      - name: Deploy ECS Infrastructure Stack
        run: |
          aws cloudformation deploy \
            --stack-name ecs-infra \
            --template-file aws-infra/ecs-secure-infrastructure.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --region eu-north-1 || ( \
              echo "=== DEPLOYMENT FAILED: FETCHING CLOUDFORMATION LOGS ===" && \
              aws cloudformation describe-stack-events \
                --stack-name ecs-infra \
                --region eu-north-1 \
                --query "StackEvents[?ResourceStatus=='CREATE_FAILED'].{Resource:LogicalResourceId,Type:ResourceType,Reason:ResourceStatusReason}" \
                --output table && \
              exit 1 \
            )


