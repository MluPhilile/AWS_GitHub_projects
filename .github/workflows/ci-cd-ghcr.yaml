name: Project_Multi_Env_Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registery
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        run: |
          IMAGE_TAG=${{ github.sha }}
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/mluphilile/aws_github_projects:$IMAGE_TAG .
          docker push ghcr.io/mluphilile/aws_github_projects:$IMAGE_TAG

  deploy-dev:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1
       # 1. Download the current active task definition
      - name: Download task definition
        run: |
          aws ecs describe-task-definition --task-definition dev-service --query taskDefinition > task-definition.json

      # 2. Update the image URI in the task definition template
      - name: Fill in the new image ID in the Amazon ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: Main_pipeline # Replace with your actual container name in ECS
          image: ghcr.io/mluphilile/aws_github_projects:${{ github.sha }}      

      # 3. Deploy the updated task definition to ECS
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: dev-service
          cluster: dev-cluster
          wait-for-service-stability: true

      - name: Deploy to Dev ECS
        run: |
          aws ecs update-service \
            --cluster dev-cluster \
            --service dev-service \
            --force-new-deployment

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

       # 1. Download the current active task definition
      - name: Download task definition
        run: |
          aws ecs describe-task-definition --task-definition staging-service --query taskDefinition > task-definition.json

      # 2. Update the image URI in the task definition template
      - name: Fill in the new image ID in the Amazon ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: Main_pipeline # Replace with your actual container name in ECS
          image: ghcr.io/mluphilile/aws_github_projects:${{ github.sha }}      

      # 3. Deploy the updated task definition to ECS
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: staging-service
          cluster: staging-cluster
          wait-for-service-stability: true

      - name: Deploy to Staging ECS
        run: |
          aws ecs update-service \
            --cluster staging-cluster \
            --service staging-service \
            --force-new-deployment