AWSTemplateFormatVersion: '2010-09-09'
Description: ECS Clusters, Task Definitions, and Services

Resources:
  DevCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: dev-cluster

  StagingCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: staging-cluster
  
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ecsTaskExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
  AppTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: github-task
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: app-container
          Image: ghcr.io/mluphilile/aws_github_projects:latest
          PortMappings:
            - ContainerPort: 80

  DevService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref DevCluster
      ServiceName: dev-service
      DesiredCount: 1
      LaunchType: FARGATE
      TaskDefinition: !Ref AppTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - subnet-06734a0d5c9e5e2d2   # replace with your subnet IDs
          SecurityGroups:
            - sg-0f4ce4119a69258b3       # replace with your security group IDs

  StagingService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref StagingCluster
      ServiceName: staging-service
      DesiredCount: 1
      LaunchType: FARGATE
      TaskDefinition: !Ref AppTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - subnet-06734a0d5c9e5e2d2   # replace with your subnet IDs
          SecurityGroups:
            - sg-0f4ce4119a69258b3       # replace with your security group IDs    