<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Number Adder</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f7f6; }
        .container { max-width: 500px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-top: 0; }
        input[type="text"] { width: 100%; padding: 10px; margin: 10px 0 20px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #218838; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>➕ Flask Addition Service</h2>
    <p>Enter numbers separated by commas (e.g., <code>10, 20.5, 5</code>):</p>
    
    <form id="adderForm">
        <input type="text" id="numberInput" placeholder="e.g. 5, 12.3, 7" required>
        <button type="submit">Calculate Sum</button>
    </form>

    <div id="result" class="result-box"></div>
</div>

<script>
    document.getElementById('adderForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const inputVal = document.getElementById('numberInput').value;
        const resultDiv = document.getElementById('result');
        
        // Convert comma-separated string into an array of floats
        const numbersArray = inputVal.split(',')
                                      .map(num => num.trim())
                                      .filter(num => num !== "")
                                      .map(num => Number(num));

        // Basic frontend validation for non-numeric conversions
        if (numbersArray.some(isNaN)) {
            showResult("Please enter valid numbers only.", "error");
            return;
        }

        try {
            // Feature: Asynchronous network call to Flask API
            const response = await fetch('/api/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ numbers: numbersArray })
            });

            const data = await response.json();

            if (response.ok) {
                showResult(`Total Sum: <strong>${data.result}</strong> (Processed ${data.items_processed} items)`, "success");
            } else {
                showResult(`Error: ${data.message}`, "error");
            }
        } catch (err) {
            showResult("Failed to reach the server backend.", "error");
        }
    });

    function showResult(message, statusClass) {
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = message;
        resultDiv.className = `result-box ${statusClass}`;
        resultDiv.style.display = 'block';
    }
</script>

</body>
</html>
