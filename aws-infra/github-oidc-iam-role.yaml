AWSTemplateFormatVersion: '2010-09-09'
Description: AWS IAM OIDC Provider and Role Configuration for Secure GitHub Actions CI/CD Pipeline

Parameters:
  GitHubOrgOrUser:
    Type: String
    Description: Your GitHub organization or personal username (e.g., mluphilile).
    Default: mluphilile
  GitHubRepositoryName:
    Type: String
    Description: The specific GitHub repository name allowed to assume this deployment role.
    Default: aws_github_projects

Resources:
  # 1. Establish the OpenID Connect (OIDC) Identity Provider to trust GitHub
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  # 2. Define the Short-Lived Trusted IAM Role for the GitHub Actions Runner
  GitHubActionsWorkflowRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GitHubActionsWorkflowRole
      Description: Short-lived IAM deployment role for automated GitHub Actions pipeline routines.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Restricts role assumption strictly to your specific repository and main branch transitions
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOrgOrUser}/${GitHubRepositoryName}:*'

      # 3. Fine-Grained Least-Privilege Policies for Infrastructure and Container Operations
      Policies:
        - PolicyName: GitHubActionsDeploymentPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Container Registry Access
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: '*'
              
              # Core CloudFormation Deployment Operations
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:ValidateTemplate
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/ecs-infra*'

              # Fine-Grained Infrastructure Resource Manipulation via Pipeline
              - Effect: Allow
                Action:
                  - ecs:CreateCluster
                  - ecs:DescribeClusters
                  - ecs:UpdateService
                  - ecs:DescribeServices
                  - ecs:RegisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                  - iam:PassRole
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVpcs
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeListeners
                Resource: '*'

Outputs:
  RoleArn:
    Description: The exact Amazon Resource Name (ARN) string to copy into your GitHub Actions workflow configuration.
    Value: !GetAtt GitHubActionsWorkflowRole.Arn
