AWSTemplateFormatVersion: '2010-09-09'
Description: AWS IAM OIDC Provider and Role Configuration for Secure GitHub Actions CI/CD Pipeline

Parameters:
  GitHubOrgOrUser:
    Type: String
    Description: Your GitHub organization or personal username (e.g., mluphilile).
    Default: mluphilile
  GitHubRepositoryName:
    Type: String
    Description: The specific GitHub repository name allowed to assume this deployment role.
    Default: aws_github_projects

Resources:
  # 1. Establish the OpenID Connect (OIDC) Identity Provider to trust GitHub
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  # 2. Define the Short-Lived Trusted IAM Role for the GitHub Actions Runner
  GitHubActionsWorkflowRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GitHubActionsWorkflowRole
      Description: Short-lived IAM deployment role for automated GitHub Actions pipeline routines.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Restricts role assumption strictly to your specific repository and main branch transitions
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOrgOrUser}/${GitHubRepositoryName}:*'

      # 3. Fine-Grained Least-Privilege Policies for Infrastructure and Container Operations
      # 3. Fine-Grained Least-Privilege Policies for Infrastructure and Container Operations
      Policies:
        - PolicyName: GitHubActionsDeploymentPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Container Registry Access
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: '*'
              
              # Core CloudFormation Deployment Operations
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:ValidateTemplate
                Resource: 
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/ecs-infra*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/oidc-provider-infra*'
                            
               # GLOBAL TAGGING PERMISSIONS (Fixes the UnauthorizedTaggingOperation)
              - Effect: Allow
                Action:
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - ecs:TagResource
                  - ecs:UntagResource
                  - iam:TagRole
                  - iam:UntagRole
                Resource: '*'

              # Complete VPC Infrastructure Permissions (Fixes the ec2:AllocateAddress error and builds out the VPC)
              - Effect: Allow
                Action:
                  - ec2:CreateVpc
                  - ec2:DeleteVpc
                  - ec2:ModifyVpcAttribute
                  - ec2:CreateSubnet
                  - ec2:DeleteSubnet
                  - ec2:ModifySubnetAttribute
                  - ec2:CreateInternetGateway
                  - ec2:DeleteInternetGateway
                  - ec2:AttachInternetGateway
                  - ec2:DetachInternetGateway
                  - ec2:CreateRouteTable
                  - ec2:DeleteRouteTable
                  - ec2:CreateRoute
                  - ec2:DeleteRoute
                  - ec2:AssociateRouteTable
                  - ec2:DisassociateRouteTable
                  - ec2:AllocateAddress
                  - ec2:ReleaseAddress
                  - ec2:CreateNatGateway
                  - ec2:DeleteNatGateway
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVpcs
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeRouteTables
                  - ec2:DescribeAddresses
                  - ec2:DescribeNatGateways
                Resource: '*'

              # Fine-Grained Service Manipulation via Pipeline
              - Effect: Allow
                Action:
                  - ecs:CreateCluster
                  - ecs:DeleteCluster
                  - ecs:DescribeClusters
                  - ecs:CreateService
                  - ecs:DeleteService
                  - ecs:UpdateService
                  - ecs:DescribeServices
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                  - iam:PassRole
                  - iam:CreateRole            
                  - iam:DeleteRole            
                  - iam:GetRole   
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy               
                  - elasticloadbalancing:CreateLoadBalancer
                  - elasticloadbalancing:DeleteLoadBalancer
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:CreateTargetGroup
                  - elasticloadbalancing:DeleteTargetGroup
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:CreateListener
                  - elasticloadbalancing:DeleteListener
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:ModifyTargetGroupAttributes
                Resource: '*'


Outputs:
  RoleArn:
    Description: The exact Amazon Resource Name (ARN) string to copy into your GitHub Actions workflow configuration.
    Value: !GetAtt GitHubActionsWorkflowRole.Arn
